[install]
# Minimum 4-day age for new package versions (supply chain defense)
# Versions published less than 4 days ago are filtered out during install/update.
# Value is in seconds: 4 days = 345600 seconds
minimumReleaseAge = 345600

[install.scopes]
"@uniswap" = { url = "https://registry.npmjs.org/" }
