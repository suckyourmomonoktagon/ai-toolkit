name: "Check PR Title"

on:
  # zizmor: ignore[dangerous-triggers] -- title validation only, no PR code checkout
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
  workflow_run:
    workflows: ["Claude: Generate PR Title & Description"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    if: ${{ github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success' }}
    name: 🔡 Check PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: bullfrogsec/bullfrog@1831f79cce8ad602eef14d2163873f27081ebfb3
        with:
          # List of IPs to allow outbound connections to.
          # By default, only localhost and IPs required for the essential operations of Github Actions are allowed.
          #allowed-ips:

          # List of domains to allow outbound connections to.
          # Wildcards are accepted. For example, if allowing `*.google.com`, this will allow `www.google.com`, `console.cloud.google.com` but not `google.com`.
          # By default, only domains required for essential operations of Github Actions and uploading job summaries are allowed.
          # Refer to https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#communication-requirements-for-github-hosted-runners-and-github for additional domains that should be allowed for additional Github Actions features.
          #allowed-domains:

          # The egress policy to enforce. Valid values are `audit` and `block`.
          # Default: audit
          egress-policy: block
      - name: Checkout repository (for composite action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Check for automated PR
        id: check-automated
        uses: ./.github/actions/check-automated-pr
        with:
          branch_name: ${{ github.head_ref }}
          pr_title: ${{ github.event.pull_request.title }}

      # Copilot coding agent PRs are opened with a placeholder "[WIP] ..." title
      # before the "Claude: Generate PR Title & Description" workflow renames it
      # to a conventional-commit title. That rename fires a new `edited` event
      # which re-runs this check against the final title, so it's safe to skip
      # the semantic check just for this transient, still-placeholder state
      # instead of failing the run outright. This is intentionally scoped to
      # this workflow only (not the shared check-automated-pr action) so it
      # doesn't also skip build/lint/test CI or code review for Copilot PRs.
      - name: Check for pending Copilot coding agent title
        id: check-pending-title
        if: ${{ github.event_name == 'pull_request_target' && steps.check-automated.outputs.is_automated != 'true' }}
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PENDING="false"
          if [[ "$BRANCH_NAME" == copilot/* && "$PR_TITLE" == "[WIP]"* ]]; then
            PENDING="true"
            echo "::notice::Copilot coding agent PR still has a placeholder title. The 'Claude: Generate PR Title & Description' workflow will rename it, which re-triggers this check."
          fi
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"

      - name: Conditional semantic PR check
        if: ${{ github.event_name == 'pull_request_target' && steps.check-automated.outputs.is_automated != 'true' && steps.check-pending-title.outputs.pending != 'true' }}
        uses: amannn/action-semantic-pull-request@536f681e2c60d973396eb60457d42ced8cd3f61a
        with:
          requireScope: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pass check for automated PRs
        if: ${{ steps.check-automated.outputs.is_automated == 'true' }}
        env:
          SKIP_REASON: ${{ steps.check-automated.outputs.skip_reason }}
        run: |
          echo "Automated PR detected: $SKIP_REASON. This check is automatically passed."

      - name: Pass check for pending Copilot coding agent title
        if: ${{ steps.check-pending-title.outputs.pending == 'true' }}
        run: |
          echo "Copilot coding agent PR has a placeholder title; skipping until it is renamed by the title-generation workflow."
