name: "Claude: Generate PR Title & Description"

# Consumer workflow that generates PR titles and descriptions using Claude AI
#
# This workflow automatically generates:
# - Conventional commit-style PR titles based on repository patterns
# - Comprehensive PR descriptions based on recent merged PR templates
#
# Triggers:
# - When a PR is opened (draft or ready)
# - When a PR is marked as ready for review
# - When a PR is synchronized (new commits pushed) with actual code changes
#
# Features:
# - Skips rebases (uses patch-ID to detect actual code changes)
# - Learns title patterns from recent commits
# - Learns description templates from recent merged PRs
# - Conventional commit format enforcement

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Concurrency: Cancel in-flight runs for the same PR
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # Checks whether Claude authentication is configured before invoking the
  # reusable workflow. validate-claude-auth (called inside
  # _generate-pr-metadata.yml) hard-fails the job when neither secret is set,
  # which breaks this workflow on forks/repos that haven't configured Claude
  # credentials. Computing this in its own job lets us skip generate-metadata
  # gracefully via `needs.check-auth.outputs.has_auth` instead of failing.
  check-auth:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_auth: ${{ steps.check.outputs.has_auth }}
    steps:
      - name: Check for Claude authentication
        id: check
        env:
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_ANTHROPIC_KEY" = "true" ] || [ "$HAS_OAUTH_TOKEN" = "true" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PR title/description generation: no Claude authentication configured (ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN)."
          fi

  generate-metadata:
    needs: check-auth
    # Skip conditions:
    # - No Claude authentication configured (see check-auth job above)
    # - Merge queue PRs (handled separately)
    # - Dependabot PRs (already have proper titles)
    # - Release PRs (have their own format)
    # - Production promotion PRs (have their own format)
    if: |
      needs.check-auth.outputs.has_auth == 'true' &&
      !contains(github.head_ref, 'gh-readonly-queue/') &&
      !contains(github.head_ref, 'dependabot/') &&
      !contains(github.head_ref, 'release/') &&
      !startsWith(github.event.pull_request.title, 'chore(release):')

    uses: ./.github/workflows/_generate-pr-metadata.yml
    with:
      generation_mode: "title,description"
      pr_number: ${{ github.event.pull_request.number }}
      base_ref: ${{ github.base_ref }}
      # Use default model (claude-opus-5)
      # Use default timeout (15 minutes)
      # Use default prompt from ai-toolkit
      commit_history_count: 30
      pr_history_count: 10
      allowed_bots: "claude"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
