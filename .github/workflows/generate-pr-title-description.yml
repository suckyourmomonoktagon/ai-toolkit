name: "Claude: Generate PR Title & Description"

# Consumer workflow that generates PR titles and descriptions using Claude AI
#
# This workflow automatically generates:
# - Conventional commit-style PR titles based on repository patterns
# - Comprehensive PR descriptions based on recent merged PR templates
#
# Triggers:
# - When a PR is opened (draft or ready)
# - When a PR is marked as ready for review
# - When a PR is synchronized (new commits pushed) with actual code changes
#
# Features:
# - Skips rebases (uses patch-ID to detect actual code changes)
# - Learns title patterns from recent commits
# - Learns description templates from recent merged PRs
# - Conventional commit format enforcement

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Concurrency: Cancel in-flight runs for the same PR
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Cheap gate: neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is
  # guaranteed to be configured (e.g. forks, or this repo before secrets are
  # provisioned). `_generate-pr-metadata.yml`'s validate-claude-auth step
  # fails the whole run when both are absent, so check here first and skip
  # the reusable workflow entirely rather than surfacing a red X for a
  # missing-config condition. `secrets.*` isn't available in `jobs.<id>.if`
  # (only `github, needs, vars, inputs` are — see the docs' context
  # availability table), but it IS available in job-level `env:`, matching
  # the HAS_DATADOG_API_KEY pattern in claude-code-review.yml.
  check-auth:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      has_auth: ${{ steps.check.outputs.has_auth }}
    steps:
      - uses: bullfrogsec/bullfrog@1831f79cce8ad602eef14d2163873f27081ebfb3 # v0.8.4

      - name: Check Claude authentication
        id: check
        run: |
          echo "has_auth=${HAS_CLAUDE_AUTH}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CLAUDE_AUTH" != "true" ]; then
            echo "::notice::Skipping PR title/description generation: neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is configured for this repository."
          fi

  generate-metadata:
    needs: check-auth
    # Skip conditions:
    # - Neither Claude credential is configured (see check-auth above)
    # - Merge queue PRs (handled separately)
    # - Dependabot PRs (already have proper titles)
    # - Release PRs (have their own format)
    # - Production promotion PRs (have their own format)
    if: |
      needs.check-auth.outputs.has_auth == 'true' &&
      !contains(github.head_ref, 'gh-readonly-queue/') &&
      !contains(github.head_ref, 'dependabot/') &&
      !contains(github.head_ref, 'release/') &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    uses: ./.github/workflows/_generate-pr-metadata.yml
    with:
      generation_mode: "title,description"
      pr_number: ${{ github.event.pull_request.number }}
      base_ref: ${{ github.base_ref }}
      # Use default model (claude-opus-5)
      # Use default timeout (15 minutes)
      # Use default prompt from ai-toolkit
      commit_history_count: 30
      pr_history_count: 10
      allowed_bots: "claude"
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
