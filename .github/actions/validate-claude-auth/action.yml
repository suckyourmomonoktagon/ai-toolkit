# Composite action to validate Claude authentication
# Reports whether ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN is provided
#
# Usage:
#   - name: Validate Authentication
#     uses: ./.github/actions/validate-claude-auth
#     with:
#       anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
#       claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: 'Validate Claude Authentication'
description: 'Validates Claude authentication when configured'

inputs:
  anthropic-api-key:
    description: 'The ANTHROPIC_API_KEY secret value (pass: secrets.ANTHROPIC_API_KEY)'
    required: false
    default: ''
  claude-oauth-token:
    description: 'The CLAUDE_CODE_OAUTH_TOKEN secret value (pass: secrets.CLAUDE_CODE_OAUTH_TOKEN)'
    required: false
    default: ''

outputs:
  authenticated:
    description: 'Whether a Claude authentication method was provided'
    value: ${{ steps.validate-auth.outputs.authenticated }}

runs:
  using: 'composite'
  steps:
    - name: Validate authentication
      id: validate-auth
      shell: bash
      env:
        API_KEY: ${{ inputs.anthropic-api-key }}
        OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
      run: |
        echo "Validating authentication configuration..."

        if [ -n "$OAUTH_TOKEN" ]; then
          echo "Using Claude Code OAuth token for authentication"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$API_KEY" ]; then
          echo "Using Anthropic API key for authentication"
          echo "authenticated=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No Claude authentication provided; skipping the documentation check."
          echo "authenticated=false" >> "$GITHUB_OUTPUT"
        fi
